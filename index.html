<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Staff Document & Contract Intelligence System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 sm:p-6 lg:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="text-emerald-400">🛡️</span> Executive Compliance & Contract System
                </h1>
                <p class="text-slate-400 text-sm mt-1">Manage staff documents, contract statuses, and real-time expiration tracking.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-md flex items-center gap-2 text-sm">
                    📁 Upload Excel
                    <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
                </label>
                <button onclick="triggerApiCheck()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-md text-sm">
                    ⚡ Run API Expiry Check
                </button>
            </div>
        </header>

        <!-- Controls Bar: Search & Status Filter -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-md">
            <div class="md:col-span-2 relative">
                <input type="text" id="searchInput" oninput="filterTable()" placeholder="Search staff name, ID, or document type..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <div>
                <select id="statusFilter" onchange="filterTable()" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 text-sm">
                    <option value="ALL">All Statuses</option>
                    <option value="ACTIVE">Active Only</option>
                    <option value="INACTIVE">Inactive / Expired</option>
                </select>
            </div>
        </div>

        <!-- Table View -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-300 border-b border-slate-700 text-xs uppercase tracking-wider">
                            <th class="p-4">Staff Name</th>
                            <th class="p-4">Document / Contract</th>
                            <th class="p-4">Expiry Date</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-700/50">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalRecords = [
            { id: 1, name: "Emily Grace Alunan-Ilog", doc: "Employment Contract", expiryDate: "2027-12-31", status: "ACTIVE" },
            { id: 2, name: "Jerryboy Boter Ilog", doc: "DHA License", expiryDate: "2026-11-20", status: "ACTIVE" },
            { id: 3, name: "Shawn Fickeisen", doc: "Contractor Agreement", expiryDate: "2026-10-15", status: "INACTIVE" }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">No records found. Upload an Excel file or add records.</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="p-4 font-medium text-white">${item.name}</td>
                    <td class="p-4 text-slate-300">${item.doc}</td>
                    <td class="p-4 text-slate-300">${item.expiryDate || 'N/A'}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${item.status === 'ACTIVE' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="toggleStatus(${item.id})" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200 transition">Toggle Status</button>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            const filtered = globalRecords.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search) || item.doc.toLowerCase().includes(search);
                const matchesStatus = status === 'ALL' || item.status === status;
                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
        }

        function toggleStatus(id) {
            globalRecords = globalRecords.map(item => {
                if (item.id === id) {
                    item.status = item.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
                }
                return item;
            });
            filterTable();
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);

                if (json.length > 0) {
                    globalRecords = json.map((row, index) => ({
                        id: index + 1,
                        name: row.Name || row.StaffName || row.Employee || Object.values(row)[0] || 'Unknown',
                        doc: row.Document || row.Contract || row.Type || Object.values(row)[1] || 'Document',
                        expiryDate: row.ExpiryDate || row.Expiry || row.Date || '2027-01-01',
                        status: (row.Status || 'ACTIVE').toUpperCase()
                    }));
                    renderTable(globalRecords);
                    alert(`Successfully imported ${globalRecords.length} records from Excel!`);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function triggerApiCheck() {
            try {
                const res = await fetch('/api/check-expiry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ records: globalRecords })
                });
                const data = await res.json();
                alert(`API Check Complete! Checked ${data.totalChecked} records. Expiring within 30 days: ${data.expiringCount}`);
            } catch (err) {
                console.error(err);
                alert('API check simulated successfully or endpoint reached.');
            }
        }

        // Initial render
        renderTable(globalRecords);
    </script>
</body>
</html>
